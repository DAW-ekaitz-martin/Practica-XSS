<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Práctica XSS · Versión vulnerable vs. segura</title>
</head>
<body>

  <h1>Demostración de Cross-Site Scripting (XSS)</h1>
  <textarea id="entrada" placeholder="Escribe aquí tu texto de prueba..."></textarea>

  <div class="botones">
    <button class="malo"  onclick="mostrarVulnerable()">Procesar</button>
    <button class="bueno" onclick="mostrarSegura()">Procesar</button>
  </div>

  <h3>Salida versión VULNERABLE</h3>
  <div  class="salida">
    <p id="salidaVulnerable"></p>
  </div>

  <h3>Salida versión SEGURA</h3>
  <div  class="salida">
    <p id="salidaSegura"></p>
  </div>

<script>
  function mostrarVulnerable() {
    const texto = document.getElementById("entrada").value;
    document.getElementById("salidaVulnerable").innerHTML = texto;
  }
  function mostrarSegura() {
    const texto = document.getElementById("entrada").value;
    document.getElementById("salidaSegura").textContent = texto;
  }
</script>

</body>
</html>
